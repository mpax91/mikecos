name = "mikeos-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "mikeos-db"
database_id = "d2a93367-a474-4b41-aa2d-a688400e4fb2"

# Service binding to THIS Worker, used by the nightly Plex crons to call
# their own chunk endpoints. They used to fetch() the public workers.dev
# URL, which Cloudflare blocks outright for a Worker calling itself
# (error 1042) — every scheduled run failed on its first chunk, which is
# why "Check now" always had to be clicked by hand. A self service
# binding is the supported way to do this: each call is still its own
# invocation with its own subrequest budget.
[[services]]
binding = "SELF"
service = "mikeos-api"

[[r2_buckets]]
binding = "FILES"
bucket_name = "mikeos-files"

[triggers]
# Nightly Plex library re-sync, the airing check, and the Inbox poll (see
# index.ts's `scheduled` export, which branches on event.cron since all
# three schedules share one handler) — 9am UTC is ~4-5am Eastern, after
# the previous night's shows have actually aired and well before Mike's
# Daily Briefing. The airing check runs on its OWN tick 30 minutes after
# sync's, not chained after it in the same invocation — sync alone can
# take several nights to fully finish on a library this size (confirmed
# via plex_libraries.synced_at going stale for days on the Music library
# specifically), and chaining them used to mean a slow sync night left
# the airing check starved of its own budget, which is exactly why some
# newly-aired episodes weren't getting flagged automatically. Each entry
# here must match its constant in index.ts exactly (PLEX_SYNC_CRON,
# PLEX_AIRING_CRON, EMAIL_SYNC_CRON).
crons = ["0 9 * * *", "30 9 * * *", "*/2 * * * *"]

[vars]
# Comma-separated exact origins the frontend is served from. Required (not
# "*") because cookie-based sessions need CORS to echo back one specific
# origin with credentials — see worker/src/auth.ts's resolveOrigin(). Add a
# custom domain here too if one gets set up later.
ALLOWED_ORIGINS = "https://mikeos.pages.dev,http://localhost:5173"
