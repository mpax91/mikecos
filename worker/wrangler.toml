name = "mikeos-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "mikeos-db"
database_id = "d2a93367-a474-4b41-aa2d-a688400e4fb2"

[[r2_buckets]]
binding = "FILES"
bucket_name = "mikeos-files"

[triggers]
# Nightly Plex library re-sync + airing check, plus the Inbox poll (see
# index.ts's `scheduled` export, which branches on event.cron since both
# schedules share one handler) — 9am UTC is ~4-5am Eastern, after the
# previous night's shows have actually aired and well before Mike's Daily
# Briefing. The Inbox entry must match index.ts's EMAIL_SYNC_CRON exactly.
crons = ["0 9 * * *", "*/2 * * * *"]

[vars]
# Comma-separated exact origins the frontend is served from. Required (not
# "*") because cookie-based sessions need CORS to echo back one specific
# origin with credentials — see worker/src/auth.ts's resolveOrigin(). Add a
# custom domain here too if one gets set up later.
ALLOWED_ORIGINS = "https://mikeos.pages.dev,http://localhost:5173"
