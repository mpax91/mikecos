name: Bootstrap D1 database

# One-time, manually-triggered job: creates the remote D1 database if it doesn't
# already exist and prints its database_id so it can be pasted into
# worker/wrangler.toml. Safe to re-run — `wrangler d1 create` fails loudly
# (non-zero exit swallowed here) if the database name is already taken, and we
# just print the existing list instead.
on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Create D1 database (or show existing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Attempting to create mikeos-db..."
          npx wrangler d1 create mikeos-db || true
          echo ""
          echo "Current D1 databases on this account:"
          npx wrangler d1 list
