name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Back up D1 before touching schema
        # A migration that goes wrong is only a minor incident if there's an
        # instant, independent way to recover — this makes that true on every
        # single deploy, regardless of what Cloudflare's own Time Travel
        # retention happens to cover at the time. Uploaded as a build
        # artifact so it survives outside of D1 entirely.
        #
        # mikeos-db is a shared database used by other MikeOS apps too (way
        # more tables than this Worker touches), and it has an FTS5 virtual
        # table (search_fts, from an unrelated feature) that `wrangler d1
        # export`'s whole-database mode flatly refuses to touch ("cannot
        # export databases with Virtual Tables"). Our migrations only ever
        # touch entities/links, so back up just those two tables instead of
        # the whole database — narrower, faster, and avoids the FTS5 export
        # bug entirely.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export mikeos-db --remote --output=pre-migration-backup.sql --table=entities --table=links
          echo "entity_count_before=$(npx wrangler d1 execute mikeos-db --remote --json --command 'SELECT COUNT(*) as n FROM entities' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].results[0].n))")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: pre-migration-backup-${{ github.sha }}
          path: worker/pre-migration-backup.sql
          retention-days: 30
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote
      - name: Verify no rows were lost by the migration
        # Any schema-recreating migration (widening a CHECK constraint, say)
        # touches every row in `entities` — if the row count drops, something
        # went wrong at the database layer and we must NOT proceed to deploy
        # a Worker built for a schema whose data just got silently damaged.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          after=$(npx wrangler d1 execute mikeos-db --remote --json --command 'SELECT COUNT(*) as n FROM entities' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].results[0].n))")
          echo "Entities before migration: $entity_count_before, after: $after"
          if [ "$after" -lt "$entity_count_before" ]; then
            echo "::error::Row count dropped from $entity_count_before to $after after migration — a backup was uploaded as build artifact pre-migration-backup-${{ github.sha }}. Aborting deploy."
            exit 1
          fi
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
                - name: Set Google Calendar ICS secrets
        if: ${{ secrets.GOOGLE_ICS_URL_PERSONAL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_ICS_URL_PERSONAL: ${{ secrets.GOOGLE_ICS_URL_PERSONAL }}
          GOOGLE_ICS_URL_SHARED: ${{ secrets.GOOGLE_ICS_URL_SHARED }}
        run: |
          printf '%s' "$GOOGLE_ICS_URL_PERSONAL" | npx wrangler secret put GOOGLE_ICS_URL_PERSONAL
          if [ -n "$GOOGLE_ICS_URL_SHARED" ]; then
            printf '%s' "$GOOGLE_ICS_URL_SHARED" | npx wrangler secret put GOOGLE_ICS_URL_SHARED
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build frontend
        env:
          VITE_API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=mikeos --branch=main
