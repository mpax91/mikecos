name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Back up D1 before touching schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export mikeos-db --remote --output=pre-migration-backup.sql --table=entities --table=links
          echo "entity_count_before=$(npx wrangler d1 execute mikeos-db --remote --json --command 'SELECT COUNT(*) as n FROM entities' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].results[0].n))")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: pre-migration-backup-${{ github.sha }}
          path: worker/pre-migration-backup.sql
          retention-days: 30
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote
      - name: Verify no rows were lost by the migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          after=$(npx wrangler d1 execute mikeos-db --remote --json --command 'SELECT COUNT(*) as n FROM entities' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].results[0].n))")
          echo "Entities before migration: $entity_count_before, after: $after"
          if [ "$after" -lt "$entity_count_before" ]; then
            echo "::error::Row count dropped from $entity_count_before to $after after migration — a backup was uploaded as build artifact pre-migration-backup-${{ github.sha }}. Aborting deploy."
            exit 1
          fi
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
      - name: Set Google Calendar ICS secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_ICS_URL_PERSONAL: ${{ secrets.GOOGLE_ICS_URL_PERSONAL }}
          GOOGLE_ICS_URL_SHARED: ${{ secrets.GOOGLE_ICS_URL_SHARED }}
        run: |
          if [ -z "$GOOGLE_ICS_URL_PERSONAL" ]; then
            echo "GOOGLE_ICS_URL_PERSONAL not set — skipping."
            exit 0
          fi
          printf '%s' "$GOOGLE_ICS_URL_PERSONAL" | npx wrangler secret put GOOGLE_ICS_URL_PERSONAL
          if [ -n "$GOOGLE_ICS_URL_SHARED" ]; then
            printf '%s' "$GOOGLE_ICS_URL_SHARED" | npx wrangler secret put GOOGLE_ICS_URL_SHARED
          fi
      - name: Set Payment Cards encryption key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYMENT_CARD_ENC_KEY: ${{ secrets.PAYMENT_CARD_ENC_KEY }}
        run: |
          if [ -z "$PAYMENT_CARD_ENC_KEY" ]; then
            echo "PAYMENT_CARD_ENC_KEY not set — skipping (Payment Cards' number/CVV fields won't save until this repo secret is added)."
            exit 0
          fi
          printf '%s' "$PAYMENT_CARD_ENC_KEY" | npx wrangler secret put PAYMENT_CARD_ENC_KEY
      - name: Set Email encryption key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_ACCOUNT_ENC_KEY: ${{ secrets.EMAIL_ACCOUNT_ENC_KEY }}
        run: |
          if [ -z "$EMAIL_ACCOUNT_ENC_KEY" ]; then
            echo "EMAIL_ACCOUNT_ENC_KEY not set — skipping (Email Accounts won't save until this repo secret is added)."
            exit 0
          fi
          printf '%s' "$EMAIL_ACCOUNT_ENC_KEY" | npx wrangler secret put EMAIL_ACCOUNT_ENC_KEY
      - name: Set ID Card encryption key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALLET_CARD_ENC_KEY: ${{ secrets.WALLET_CARD_ENC_KEY }}
        run: |
          if [ -z "$WALLET_CARD_ENC_KEY" ]; then
            echo "WALLET_CARD_ENC_KEY not set — skipping (ID card numbers won't save until this repo secret is added)."
            exit 0
          fi
          printf '%s' "$WALLET_CARD_ENC_KEY" | npx wrangler secret put WALLET_CARD_ENC_KEY
      - name: Set Plex secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLEX_SERVER_URL: ${{ secrets.PLEX_SERVER_URL }}
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          if [ -z "$PLEX_SERVER_URL" ] || [ -z "$PLEX_TOKEN" ]; then
            echo "PLEX_SERVER_URL/PLEX_TOKEN not set — skipping (Plex features stay off until both repo secrets are added)."
            exit 0
          fi
          printf '%s' "$PLEX_SERVER_URL" | npx wrangler secret put PLEX_SERVER_URL
          printf '%s' "$PLEX_TOKEN" | npx wrangler secret put PLEX_TOKEN

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build frontend
        env:
          VITE_API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=mikeos --branch=main
